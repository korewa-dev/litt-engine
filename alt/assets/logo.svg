<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="none"/>

  <!-- Border -->
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <polyline points="10,26 10,10 26,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="486,26 486,10 470,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="10,486 10,470 26,470" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="486,486 486,470 470,470" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- ===== LITT COMMAND CORE (top) ===== -->
  <circle cx="256" cy="120" r="106" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.15"/>
  <circle cx="256" cy="120" r="94" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
  <circle cx="256" cy="120" r="82" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="120" r="70" fill="none" stroke="#00f0ff" stroke-width="3"/>
  <circle cx="256" cy="120" r="45" fill="none" stroke="#ff2d95" stroke-width="2"/>
  <circle cx="256" cy="120" r="25" fill="#080c18" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="256" cy="120" r="15" fill="#ff2d95"/>
  <circle cx="256" cy="120" r="8" fill="#ffaa32" filter="url(#glow)"/>

  <text x="256" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00f0ff" letter-spacing="4">LITT</text>

  <!-- Orbiting nodes -->
  <circle cx="326" cy="120" r="4" fill="#ffaa32"/>
  <circle cx="256" cy="50" r="4" fill="#ffaa32"/>
  <circle cx="186" cy="120" r="4" fill="#ffaa32"/>
  <circle cx="256" cy="190" r="4" fill="#ffaa32"/>

  <!-- ===== COMMAND BEAMS ===== -->
  <line x1="256" y1="145" x2="256" y2="265" stroke="#00f0ff" stroke-width="12" opacity="0.15"/>
  <line x1="256" y1="145" x2="256" y2="265" stroke="#00f0ff" stroke-width="4"/>
  <line x1="246" y1="140" x2="241" y2="265" stroke="#ff2d95" stroke-width="2" opacity="0.5"/>
  <line x1="266" y1="140" x2="271" y2="265" stroke="#ff2d95" stroke-width="2" opacity="0.5"/>

  <!-- Data flow -->
  <circle cx="256" cy="165" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="256" cy="185" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="256" cy="205" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="256" cy="225" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="256" cy="245" r="2" fill="#00f0ff" opacity="0.9"/>

  <!-- ===== ROBOT WORKER (bottom) ===== -->
  <!-- Antenna -->
  <line x1="256" y1="270" x2="256" y2="250" stroke="#647896" stroke-width="2"/>
  <circle cx="256" cy="246" r="4" fill="#ffaa32"/>

  <!-- Head -->
  <polygon points="226,270 286,270 296,282 296,318 286,325 226,325 216,318 216,282" fill="#1e283a" stroke="#647896" stroke-width="2"/>
  <!-- Visor -->
  <rect x="228" y="286" width="56" height="20" fill="#080c18" rx="2"/>
  <!-- Eyes looking DOWN at work -->
  <rect x="234" y="294" width="16" height="10" fill="#ffaa32"/>
  <rect x="262" y="294" width="16" height="10" fill="#ffaa32"/>
  <!-- Pupils shifted down -->
  <rect x="236" y="298" width="12" height="6" fill="#c87820"/>
  <rect x="264" y="298" width="12" height="6" fill="#c87820"/>

  <!-- Torso -->
  <polygon points="201,325 311,325 320,340 320,420 310,435 202,435 192,420 192,340" fill="#121a2a" stroke="#647896" stroke-width="2"/>

  <!-- Chest receiver -->
  <rect x="226" y="345" width="60" height="18" fill="#080c18" stroke="#00f0ff" stroke-width="1"/>
  <rect x="236" y="349" width="40" height="10" fill="#00f0ff" opacity="0.4"/>

  <!-- Status lights -->
  <circle cx="208" cy="415" r="4" fill="#32ff78"/>
  <circle cx="218" cy="415" r="4" fill="#32ff78"/>
  <circle cx="228" cy="415" r="4" fill="#ffaa32"/>

  <!-- Left arm - working (angled down) -->
  <rect x="168" y="345" width="24" height="40" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <circle cx="180" cy="390" r="12" fill="#1e283a" stroke="#647896" stroke-width="2"/>
  <line x1="180" y1="395" x2="168" y2="445" stroke="#141e30" stroke-width="14"/>
  <line x1="180" y1="395" x2="168" y2="445" stroke="#647896" stroke-width="1"/>
  <rect x="158" y="440" width="20" height="14" fill="#232e48" stroke="#647896" stroke-width="2"/>
  <!-- Tool -->
  <rect x="152" y="450" width="32" height="8" fill="#ffaa32"/>

  <!-- Right arm - working (angled down) -->
  <rect x="320" y="345" width="24" height="40" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <circle cx="332" cy="390" r="12" fill="#1e283a" stroke="#647896" stroke-width="2"/>
  <line x1="332" y1="395" x2="344" y2="445" stroke="#141e30" stroke-width="14"/>
  <line x1="332" y1="395" x2="344" y2="445" stroke="#647896" stroke-width="1"/>
  <rect x="334" y="440" width="20" height="14" fill="#232e48" stroke="#647896" stroke-width="2"/>
  <!-- Tool -->
  <rect x="328" y="450" width="32" height="8" fill="#ffaa32"/>

  <!-- Left leg -->
  <rect x="218" y="435" width="22" height="35" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <circle cx="229" cy="475" r="10" fill="#1e283a" stroke="#647896" stroke-width="2"/>
  <rect x="220" y="480" width="18" height="40" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <rect x="214" y="515" width="30" height="10" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- Right leg -->
  <rect x="272" y="435" width="22" height="35" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <circle cx="283" cy="475" r="10" fill="#1e283a" stroke="#647896" stroke-width="2"/>
  <rect x="274" y="480" width="18" height="40" fill="#141e30" stroke="#647896" stroke-width="1"/>
  <rect x="268" y="515" width="30" height="10" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- ===== WORK SPARKS ===== -->
  <g stroke="#ffaa32" stroke-width="1" opacity="0.7">
    <line x1="160" y1="455" x2="145" y2="440"/>
    <line x1="165" y1="458" x2="155" y2="438"/>
    <line x1="155" y1="452" x2="140" y2="445"/>
    <line x1="352" y1="455" x2="367" y2="440"/>
    <line x1="347" y1="458" x2="357" y2="438"/>
    <line x1="357" y1="452" x2="372" y2="445"/>
  </g>
  <g fill="#ffaa32" opacity="0.8">
    <circle cx="142" cy="438" r="2"/><circle cx="152" cy="435" r="1.5"/>
    <circle cx="370" cy="438" r="2"/><circle cx="360" cy="435" r="1.5"/>
    <circle cx="148" cy="448" r="1.5"/><circle cx="364" cy="448" r="1.5"/>
  </g>

  <!-- ===== GROUND ===== -->
  <line x1="40" y1="530" x2="472" y2="530" stroke="#324060" stroke-width="2"/>
  <g stroke="#324060" stroke-width="1" opacity="0.4">
    <line x1="60" y1="530" x2="60" y2="545"/><line x1="100" y1="530" x2="100" y2="545"/>
    <line x1="140" y1="530" x2="140" y2="545"/><line x1="180" y1="530" x2="180" y2="545"/>
    <line x1="220" y1="530" x2="220" y2="545"/><line x1="260" y1="530" x2="260" y2="545"/>
    <line x1="300" y1="530" x2="300" y2="545"/><line x1="340" y1="530" x2="340" y2="545"/>
    <line x1="380" y1="530" x2="380" y2="545"/><line x1="420" y1="530" x2="420" y2="545"/>
    <line x1="460" y1="530" x2="460" y2="545"/>
  </g>

  <!-- ===== PARTICLES ===== -->
  <g fill="#00f0ff" opacity="0.4">
    <circle cx="100" cy="100" r="2"/><circle cx="420" cy="80" r="1.5"/>
    <circle cx="80" cy="200" r="2"/><circle cx="440" cy="250" r="1.5"/>
  </g>
  <g fill="#ff2d95" opacity="0.3">
    <circle cx="150" cy="70" r="1.5"/><circle cx="370" cy="90" r="2"/>
  </g>
</svg>
