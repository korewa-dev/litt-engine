name: Stabilization

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core-stabilization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stabilization regressions
        run: make stabilization-test
      - name: Run stabilization regressions
        run: ./stabilization_tests.exe

  c-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C runtime contract tests
        run: make -C alt/src/native test

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Engine and Game header paths
        shell: pwsh
        run: |
          Set-Content engine_compile_smoke.cpp '#include "litt_engine.h"'
          Add-Content engine_compile_smoke.cpp 'int main() { return 0; }'
          cl /nologo /std:c++17 /EHsc /I alt\src\native\littcore /c engine_compile_smoke.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content game_compile_smoke.cpp '#include "litt_game.h"'
          Add-Content game_compile_smoke.cpp 'int main() { return 0; }'
          cl /nologo /std:c++17 /EHsc /I alt\src\native\littcore /c game_compile_smoke.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile every littcore header standalone
        shell: pwsh
        run: |
          $headers = Get-ChildItem alt\src\native\littcore\*.h
          $failed = @()
          foreach ($header in $headers) {
            $name = $header.Name
            Set-Content header_smoke.cpp "#include `"$name`""
            Add-Content header_smoke.cpp 'int main() { return 0; }'
            cl /nologo /std:c++17 /EHsc /I alt\src\native\littcore /c header_smoke.cpp /Fo:header_smoke.obj
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("Standalone header compile failures: " + ($failed -join ", "))
            exit 1
          }
      - name: Build Windows stabilization regressions
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /EHsc /I alt\src\native\littcore
          alt\src\native\littcore\litt_stabilization_tests.cpp
          /Fe:stabilization_windows.exe gdi32.lib user32.lib winmm.lib
      - name: Run Windows stabilization regressions
        shell: cmd
        run: stabilization_windows.exe
      - name: Build native engine tests
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /EHsc /I alt\src\native\littcore
          alt\src\native\littcore\litt_engine_tests.cpp
          alt\src\native\littcore\litt_math.cpp
          /Fe:tests.exe gdi32.lib user32.lib winmm.lib
      - name: Run native engine tests
        shell: cmd
        run: tests.exe
