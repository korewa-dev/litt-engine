<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#61aaee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4dabf7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbb55;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff922b;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="512" height="512" fill="none"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#4dabf7" stroke-width="2" opacity="0.15"/>

  <!-- Corner accent dots -->
  <circle cx="12" cy="12" r="4" fill="#4dabf7" opacity="0.24"/>
  <circle cx="500" cy="12" r="4" fill="#4dabf7" opacity="0.24"/>
  <circle cx="12" cy="500" r="4" fill="#4dabf7" opacity="0.24"/>
  <circle cx="500" cy="500" r="4" fill="#4dabf7" opacity="0.24"/>

  <!-- ===== "L" MARK — centered in square ===== -->
  <!-- Vertical bar -->
  <rect x="164" y="80" width="32" height="280" fill="url(#blue-grad)"/>
  <rect x="174" y="80" width="12" height="280" fill="#61aaee" opacity="0.7"/>

  <!-- Horizontal bar -->
  <rect x="164" y="344" width="280" height="32" fill="url(#blue-grad)"/>
  <rect x="164" y="354" width="280" height="12" fill="#61aaee" opacity="0.7"/>

  <!-- Corner join -->
  <rect x="162" y="342" width="36" height="36" fill="url(#blue-grad)"/>
  <rect x="172" y="348" width="16" height="26" fill="#61aaee" opacity="0.7"/>

  <!-- Top tip glow -->
  <circle cx="180" cy="64" r="16" fill="url(#amber-grad)" filter="url(#glow)"/>
  <circle cx="180" cy="64" r="8" fill="#ffbb55"/>

  <!-- Right tip glow -->
  <circle cx="444" cy="360" r="16" fill="url(#amber-grad)" filter="url(#glow)"/>
  <circle cx="444" cy="360" r="8" fill="#ffbb55"/>

  <!-- Scatter particles along vertical ray -->
  <circle cx="180" cy="120" r="4" fill="#4dabf7" opacity="0.8"/>
  <circle cx="180" cy="170" r="3" fill="#4dabf7" opacity="0.6"/>
  <circle cx="180" cy="220" r="4" fill="#4dabf7" opacity="0.4"/>
  <circle cx="180" cy="270" r="3" fill="#4dabf7" opacity="0.25"/>

  <!-- Scatter particles along horizontal ray -->
  <circle cx="220" cy="360" r="3" fill="#4dabf7" opacity="0.7"/>
  <circle cx="280" cy="360" r="3" fill="#4dabf7" opacity="0.5"/>
  <circle cx="340" cy="360" r="4" fill="#4dabf7" opacity="0.35"/>
  <circle cx="400" cy="360" r="3" fill="#4dabf7" opacity="0.2"/>

  <!-- Ray bounce 1: from corner up-right -->
  <polyline points="180,380 220,340 260,340 260,300" fill="none" stroke="#ff922b" stroke-width="3" opacity="0.35" stroke-linejoin="miter"/>
  <circle cx="260" cy="300" r="7" fill="#ff922b" opacity="0.5"/>

  <!-- Ray bounce 2: from right tip upward -->
  <polyline points="444,360 479,335 514,335 514,370" fill="none" stroke="#ff922b" stroke-width="2" opacity="0.25" stroke-linejoin="miter"/>
  <circle cx="514" cy="370" r="6" fill="#ff922b" opacity="0.4"/>

  <!-- Center alignment crosshair (subtle) -->
  <line x1="256" y1="4" x2="256" y2="20" stroke="#4dabf7" stroke-width="1" opacity="0.1"/>
  <line x1="4" y1="256" x2="20" y2="256" stroke="#4dabf7" stroke-width="1" opacity="0.1"/>
</svg>
