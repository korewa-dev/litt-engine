  <g fill="#00f0ff">
    <rect x="392" y="295" width="10" height="14" opacity="0.7"/>
    <rect x="408" y="295" width="10" height="14" opacity="0.9"/>
    <rect x="424" y="295" width="10" height="14" opacity="0.4"/>
    <rect x="392" y="320" width="10" height="14" opacity="0.85"/>
