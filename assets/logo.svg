<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#647896"/>
      <stop offset="100%" style="stop-color:#3c4e68"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="none"/>

  <!-- Border -->
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <polyline points="10,26 10,10 26,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="486,26 486,10 470,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="10,486 10,470 26,470" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="486,486 486,470 470,470" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- ===== ROBOT ===== -->
  <!-- Antenna -->
  <line x1="256" y1="60" x2="256" y2="30" stroke="#647896" stroke-width="3"/>
  <circle cx="256" cy="24" r="7" fill="#ff2d95" filter="url(#glow)"/>

  <!-- Head -->
  <polygon points="186,60 326,60 336,80 336,130 326,140 186,140 176,130 176,80" fill="#192337" stroke="#647896" stroke-width="2"/>
  <!-- Eyes -->
  <rect x="196" y="88" width="68" height="24" fill="#0a0f1e" rx="3"/>
  <rect x="202" y="92" width="28" height="16" fill="#00f0ff"/>
  <rect x="258" y="92" width="28" height="16" fill="#00f0ff"/>
  <rect x="206" y="94" width="20" height="12" fill="#96ffff" opacity="0.7"/>
  <rect x="262" y="94" width="20" height="12" fill="#96ffff" opacity="0.7"/>

  <!-- Neck -->
  <rect x="241" y="140" width="30" height="18" fill="#283246" stroke="#647896" stroke-width="1"/>
  <line x1="241" y1="146" x2="271" y2="146" stroke="#3c4e68" stroke-width="1"/>
  <line x1="241" y1="152" x2="271" y2="152" stroke="#3c4e68" stroke-width="1"/>

  <!-- Torso -->
  <polygon points="176,158 336,158 346,188 346,288 336,300 176,300 166,288 166,188" fill="#141e32" stroke="#647896" stroke-width="2"/>

  <!-- Chest panel lines -->
  <line x1="186" y1="170" x2="186" y2="288" stroke="#283246" stroke-width="1"/>
  <line x1="326" y1="170" x2="326" y2="288" stroke="#283246" stroke-width="1"/>
  <line x1="176" y1="210" x2="336" y2="210" stroke="#283246" stroke-width="1"/>

  <!-- ===== HEART (center of chest) ===== -->
  <g transform="translate(256, 235)">
    <!-- Heart glow layers -->
    <circle cx="0" cy="-4" r="42" fill="rgba(0,240,255,0.06)"/>
    <circle cx="0" cy="-4" r="34" fill="rgba(0,240,255,0.1)"/>
    <!-- Heart shape -->
    <path d="M0,18 C-20,-2 -36,-14 -36,-28 C-36,-40 -26,-48 -16,-48 C-8,-48 -2,-42 0,-36 C2,-42 8,-48 16,-48 C26,-48 36,-40 36,-28 C36,-14 20,-2 0,18Z" fill="#ff3250" stroke="#ff2d95" stroke-width="1.5"/>
    <path d="M0,12 C-14,-4 -26,-14 -26,-24 C-26,-33 -19,-39 -12,-39 C-6,-39 -2,-34 0,-30 C2,-34 6,-39 12,-39 C19,-39 26,-33 26,-24 C26,-14 14,-4 0,12Z" fill="#ff2d95"/>
    <path d="M0,6 C-8,-4 -16,-11 -16,-18 C-16,-24 -11,-28 -7,-28 C-4,-28 -1,-25 0,-22 C1,-25 4,-28 7,-28 C11,-28 16,-24 16,-18 C16,-11 8,-4 0,6Z" fill="#ffaa32"/>
    <!-- Pulse rings -->
    <circle cx="0" cy="-4" r="48" fill="none" stroke="#ff3250" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="-4" r="56" fill="none" stroke="#ff3250" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Energy tubes from heart -->
  <path d="M244,231 L200,190 L200,170" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
  <path d="M268,231 L312,190 L312,170" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="215" x2="256" y2="158" stroke="#ff2d95" stroke-width="2" opacity="0.35"/>

  <!-- Left arm -->
  <circle cx="156" cy="185" r="16" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="142" y="185" width="28" height="45" fill="#192337" stroke="#647896" stroke-width="1"/>
  <circle cx="156" cy="238" r="14" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="146" y="240" width="20" height="50" fill="#192337" stroke="#647896" stroke-width="1"/>
  <rect x="140" y="288" width="32" height="20" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- Right arm -->
  <circle cx="356" cy="185" r="16" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="342" y="185" width="28" height="45" fill="#192337" stroke="#647896" stroke-width="1"/>
  <circle cx="356" cy="238" r="14" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="346" y="240" width="20" height="50" fill="#192337" stroke="#647896" stroke-width="1"/>
  <rect x="340" y="288" width="32" height="20" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- Left leg -->
  <rect x="196" y="300" width="26" height="50" fill="#192337" stroke="#647896" stroke-width="1"/>
  <circle cx="209" cy="355" r="12" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="198" y="360" width="22" height="55" fill="#192337" stroke="#647896" stroke-width="1"/>
  <rect x="192" y="412" width="34" height="14" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- Right leg -->
  <rect x="290" y="300" width="26" height="50" fill="#192337" stroke="#647896" stroke-width="1"/>
  <circle cx="303" cy="355" r="12" fill="#1e2a41" stroke="#647896" stroke-width="2"/>
  <rect x="292" y="360" width="22" height="55" fill="#192337" stroke="#647896" stroke-width="1"/>
  <rect x="286" y="412" width="34" height="14" fill="#232e48" stroke="#647896" stroke-width="2"/>

  <!-- Status lights -->
  <circle cx="190" cy="285" r="4" fill="#32ff78"/>
  <circle cx="202" cy="285" r="4" fill="#32ff78"/>
  <circle cx="214" cy="285" r="4" fill="#ffaa32"/>

  <!-- Particles -->
  <g fill="#00f0ff" opacity="0.4">
    <circle cx="100" cy="100" r="2"/><circle cx="420" cy="80" r="1.5"/>
    <circle cx="80" cy="200" r="2"/><circle cx="440" cy="250" r="1.5"/>
    <circle cx="120" cy="350" r="1.5"/><circle cx="400" cy="380" r="2"/>
    <circle cx="60" cy="420" r="1.5"/><circle cx="460" cy="430" r="2"/>
  </g>
  <g fill="#ff2d95" opacity="0.3">
    <circle cx="150" cy="70" r="1.5"/><circle cx="370" cy="90" r="2"/>
    <circle cx="90" cy="300" r="1.5"/><circle cx="430" cy="320" r="2"/>
  </g>
</svg>
