<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00b8d4"/>
      <stop offset="100%" style="stop-color:#00f0ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff922b"/>
      <stop offset="100%" style="stop-color:#ffbb55"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent bg -->
  <rect width="512" height="512" fill="none"/>

  <!-- Border -->
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>

  <!-- Corner brackets -->
  <polyline points="10,30 10,10 30,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="482,30 482,10 462,10" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="10,482 10,462 30,462" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <polyline points="482,482 482,462 462,462" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- ===== TINY ENGINE CORE (bottom center) ===== -->
  <!-- Gear teeth -->
  <g stroke="#00f0ff" stroke-width="3" fill="none">
    <line x1="256" y1="398" x2="256" y2="418"/>
    <line x1="256" y1="398" x2="256" y2="418" transform="rotate(30,256,408)"/>
    <line x1="256" y1="398" x2="256" y2="418" transform="rotate(60,256,408)"/>
    <line x1="256" y1="398" x2="256" y2="418" transform="rotate(90,256,408)"/>
    <line x1="256" y1="398" x2="256" y2="418" transform="rotate(120,256,408)"/>
    <line x1="256" y1="398" x2="256" y2="418" transform="rotate(150,256,408)"/>
  </g>
  <!-- Core circles -->
  <circle cx="256" cy="408" r="36" fill="#142850" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="256" cy="408" r="24" fill="#0f1932"/>
  <circle cx="256" cy="408" r="14" fill="url(#cyan)"/>
  <circle cx="256" cy="408" r="6" fill="#ff2d95" filter="url(#glow)"/>

  <!-- ===== ENERGY BEAMS ===== -->
  <g stroke-width="2" fill="none" opacity="0.6">
    <line x1="256" y1="372" x2="240" y2="200" stroke="#00f0ff"/>
    <line x1="256" y1="372" x2="260" y2="180" stroke="#00f0ff"/>
    <line x1="256" y1="372" x2="256" y2="150" stroke="#00f0ff" stroke-width="3" opacity="0.9"/>
    <line x1="256" y1="372" x2="272" y2="190" stroke="#00f0ff"/>
    <line x1="256" y1="372" x2="290" y2="210" stroke="#00f0ff"/>
