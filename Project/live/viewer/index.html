<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Litt Live - AI-Exclusive Observer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87b7d4;font-family:Consolas,monospace}
  #hud{position:fixed;top:12px;left:12px;z-index:10;background:rgba(8,14,20,.78);color:#bfe3f2;
       padding:10px 14px;border-radius:8px;border:1px solid #2e4a5c;font-size:12px;line-height:1.55}
  #hud b{color:#ffd97a} #hud .ro{color:#7fd48a}
  #hint{position:fixed;bottom:12px;left:12px;color:#eef7ff;opacity:.75;font-size:11px;
        text-shadow:0 1px 2px #0006}
</style>
</head>
<body>
<div id="hud">
  <b>LITT LIVE</b> &middot; <span class="ro">READ-ONLY OBSERVER</span><br>
  mode: ai-exclusive &mdash; humans prompt, only the AI builds<br>
  chunks: <span id="n">0</span> &middot; sync: <span id="t">-</span> &middot; <span id="s">connecting...</span>
</div>
<div id="hint">drag = orbit &middot; wheel = zoom &middot; this window cannot edit the world</div>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
  var scene, cam, renderer, sun;
  var target = new THREE.Vector3(0,0,0);
  var sph = { theta: Math.PI*0.25, phi: Math.PI*0.34, r: 46 };
  var meshes = {};            // chunk id -> THREE.Group
  var palette = null;

  function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b7d4);
    scene.fog = new THREE.Fog(0x87b7d4, 60, 220);
    cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    document.body.appendChild(renderer.domElement);
    var hemi = new THREE.HemisphereLight(0xdfefff, 0x50663c, 0.85);
    sun = new THREE.DirectionalLight(0xfff2cf, 1.05);
    sun.position.set(40,70,20);
    scene.add(hemi); scene.add(sun);
    addEventListener('resize', function(){
      cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    addEventListener('mousedown', function(e){ drag=e.button===0?{x:e.clientX,y:e.clientY}:null; });
    addEventListener('mousemove', function(e){
      if(!drag) return;
      sph.theta -= (e.clientX-drag.x)*0.006;
      sph.phi   = Math.max(0.08, Math.min(1.45, sph.phi - (e.clientY-drag.y)*0.005));
      drag={x:e.clientX,y:e.clientY};
    });
    addEventListener('mouseup', function(){ drag=null; });
    addEventListener('wheel', function(e){
      sph.r = Math.max(6, Math.min(240, sph.r * (e.deltaY>0 ? 1.09 : 0.92)));
    }, {passive:true});
    requestAnimationFrame(loop);
  }

  var drag=null;
  function placeCam(){
    cam.position.set(
      target.x + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
      target.y + sph.r*Math.cos(sph.phi),
      target.z + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
    cam.lookAt(target);
  }

  function parseObj(text){
    var v=[], vn=[], groups={}, cur='default';
    var lines=text.split('\n');
    for(var i=0;i<lines.length;i++){
      var L=lines[i];
      if(L.indexOf('usemtl ')===0){ cur=L.slice(7).trim(); }
      else if(L.charAt(0)==='v' && L.charAt(1)===' '){
        var p=L.trim().split(/\s+/); v.push([+p[1],+p[2],+p[3]]);
      } else if(L.indexOf('vn ')===0){
        var q=L.trim().split(/\s+/); vn.push([+q[1],+q[2],+q[3]]);
      } else if(L.charAt(0)==='f'){
        var parts=L.trim().split(/\s+/).slice(1), pos=[], nor=[];
        for(var k=0;k<parts.length;k++){
          var seg=parts[k].split('/');
          pos.push(v[parseInt(seg[0],10)-1]);
          nor.push(vn[parseInt(seg[seg.length-1],10)-1]);
        }
        if(!groups[cur]) groups[cur]=[];
        // fan-triangulate polygons > 3 just in case
        for(var t=1;t<pos.length-1;t++){
          groups[cur].push(pos[0],nor[0], pos[t],nor[t], pos[t+1],nor[t+1]);
        }
      }
    }
    var out=[];
    for(var m in groups){
      var arr=groups[m], P=new Float32Array(arr.length), N=new Float32Array(arr.length);
      for(var j=0;j<arr.length;j+=2){
        P.set(arr[j], (j/2|0)*3);
        N.set(arr[j+1], (j/2|0)*3);
      }
      var g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(P,3));
      g.setAttribute('normal',   new THREE.BufferAttribute(N,3));
      out.push({mat:m, geo:g});
    }
    return out;
  }

  function colorFor(matName){
    if(palette && palette[matName]){
      var c=palette[matName];
      return new THREE.Color(c[0], c[1], c[2]);
    }
    return new THREE.Color(0x9aa79a);
  }

  function loadChunk(chunk){
    var req=new XMLHttpRequest();
    req.open('GET','../'+chunk.path, true);
    req.onload=function(){
      if(req.status!==200) return;
      var group=new THREE.Group();
      var parts=parseObj(req.responseText);
      for(var i=0;i<parts.length;i++){
        var mesh=new THREE.Mesh(parts[i].geo,
          new THREE.MeshLambertMaterial({color: colorFor(parts[i].mat)}));
        group.add(mesh);
      }
      group.position.fromArray(chunk.position||[0,0,0]);
      scene.add(group);
      meshes[chunk.id]=group;
      document.getElementById('n').textContent=Object.keys(meshes).length;
    };
    req.send();
  }

  function sync(){
    var req=new XMLHttpRequest();
    req.open('GET','../world_state.json?ts='+Date.now(), true);
    req.onload=function(){
      if(req.status!==200){ st('state unreachable'); return; }
      try{
        var s=JSON.parse(req.responseText);
        palette=s.palette||palette;
        if(s.camera){ target.fromArray(s.camera.target||[0,0,0]); sph.r=sph.r||s.camera.distance||46; }
        var want={};
        (s.chunks||[]).forEach(function(c){
          want[c.id]=1;
          if(!meshes[c.id]){
            loadChunk(c);
          } else {
            meshes[c.id].position.fromArray(c.position||[0,0,0]);
          }
        });
        Object.keys(meshes).forEach(function(id){
          if(!want[id]){ scene.remove(meshes[id]); delete meshes[id]; }
        });
        document.getElementById('n').textContent=Object.keys(meshes).length;
        document.getElementById('t').textContent=new Date().toLocaleTimeString();
        st(s.mode==='ai-exclusive' ? 'AI is building...' : 'live');
      }catch(e){ st('bad state json'); }
    };
    req.onerror=function(){ st('offline / server stopped'); };
    req.send();
  }
  function st(t){ document.getElementById('s').textContent=t; }

  var last=0;
  function loop(ts){
    requestAnimationFrame(loop);
    if(ts-last>2000){ last=ts; sync(); }
    placeCam();
    renderer.render(scene,cam);
  }
  init(); sync();
})();
</script>
</body>
</html>
