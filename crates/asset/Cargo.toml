[package]
name = "litt-asset"
version = "0.1.0"
edition = "2021"
description = "Asset pipeline for Litt Engine -- model, texture, shader, and material loading"

[dependencies]
litt-math = { path = "../math" }
bytemuck = { workspace = true }
log = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
stb_truetype = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winnt", "handleapi", "fileapi", "winbase"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
