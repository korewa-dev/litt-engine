[package]
name = "litt-config"
version = "0.1.0"
edition = "2021"
description = "Configuration system for Litt Engine — settings, presets, and persistence"

[dependencies]
litt-math = { path = "../math" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
