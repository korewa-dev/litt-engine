[package]
name = "litt-platform"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ash = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]}
winapi = { version = "0.3", features = ["libloaderapi", "d3d12", "dxgi", "d3d11", "winerror", "d3dcommon", "d3d12shader", "cguid", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "term", "user"] }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
android-activity = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


