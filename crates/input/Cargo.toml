[package]
name = "litt-input"
version = "0.1.0"
edition = "2021"
description = "Input system for Litt Engine -- keyboard, mouse, gamepad"

[dependencies]
litt-math = { path = "../math" }
litt-platform = { path = "../platform" }
bytemuck = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics", "Win32_UI_Input_KeyboardAndMouse"] }

# No Linux-specific dependencies needed -- input is pure Rust with virtual key codes.
