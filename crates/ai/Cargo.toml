[package]
name = "litt-ai"
version = "0.1.0"
edition = "2021"
description = "Universal AI acceleration layer for Litt Engine — NPU, GPU, and CPU inference backends"

[dependencies]
litt-math = { path = "../math" }
ash = { workspace = true, optional = true }
bytemuck = { workspace = true }
log = { workspace = true }
libloading = { version = "0.8", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
