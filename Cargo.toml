[package]
name = "litt"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight Vulkan path tracing engine for AMD, Intel Arc, and Moore Threads GPUs with NPU acceleration"
license = "MIT"

[workspace]
members = [".", "crates/math", "crates/platform", "crates/vulkan", "crates/renderer", "crates/pathtracer", "crates/fidelityfx", "crates/ecs", "crates/dx12", "crates/ags", "crates/physics", "crates/ai", "crates/asset"]

[workspace.package]
rust-version = "1.75"
edition = "2021"

[workspace.dependencies]
litt-math = { path = "crates/math" }
litt-platform = { path = "crates/platform" }
litt-vulkan = { path = "crates/vulkan" }
litt-renderer = { path = "crates/renderer" }
litt-pathtracer = { path = "crates/pathtracer" }
litt-fidelityfx = { path = "crates/fidelityfx" }
litt-ecs = { path = "crates/ecs" }
litt-dx12 = { path = "crates/dx12" }
litt-ags = { path = "crates/ags" }
litt-physics = { path = "crates/physics" }
litt-ai = { path = "crates/ai" }
litt-asset = { path = "crates/asset" }
ash = { version = "0.38", default-features = false }
ash-window = "0.13"
vma = "0.3"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
bitflags = "2"
log = { version = "0.4", default-features = false }

[dependencies]
litt-math = { path = "crates/math" }
litt-platform = { path = "crates/platform" }
litt-vulkan = { path = "crates/vulkan", optional = true }
litt-renderer = { path = "crates/renderer" }
litt-pathtracer = { path = "crates/pathtracer" }
litt-fidelityfx = { path = "crates/fidelityfx" }
litt-dx12 = { path = "crates/dx12", optional = true }
litt-ags = { path = "crates/ags" }
litt-physics = { path = "crates/physics" }
litt-ai = { path = "crates/ai" }
litt-asset = { path = "crates/asset" }
ash = { workspace = true }
bytemuck = { workspace = true }
bitflags = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]}

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "term", "user"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
rpath = false

[[bin]]
name = "litt"
path = "src/main.rs"

[lib]
name = "litt"
path = "src/lib.rs"

[features]
default = ["vulkan"]
vulkan = ["litt-vulkan"]
dx12 = ["litt-dx12"]